<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados - Método símplex</title>
  <!-- Bootstrap desde internet (necesita conexión) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos propios: tabla y pivote resaltado -->
  <link href="/app/resultados.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Barra superior -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Método símplex · Resultados</span>
    </div>
  </nav>

  <div class="container pb-5">
    <div class="row g-4">

      <!-- Columna izquierda: historial de problemas guardados -->
      <aside class="col-lg-3">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            Historial
            <button id="btn-actualizar" class="btn btn-sm btn-outline-secondary">Actualizar</button>
          </div>
          <div id="historial" class="list-group list-group-flush"></div>
        </div>
      </aside>

      <!-- Columna derecha: resultado del problema seleccionado -->
      <main class="col-lg-9">

        <!-- Mensajes: indicaciones, errores o aviso de "sin resolver" -->
        <div id="mensaje" class="alert alert-info">Selecciona un problema del historial.</div>

        <!-- Detalle: se muestra solo cuando hay un resultado cargado -->
        <div id="detalle" class="d-none">

          <!-- Resumen: estado, valor de Z y solución -->
          <div class="card mb-4">
            <div class="card-body">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h4 id="titulo" class="mb-0"></h4>
                <span id="estado" class="badge fs-6"></span>
              </div>
              <div class="row">
                <div class="col-sm-4">
                  <div class="text-muted small">Valor de Z</div>
                  <div id="valor-z" class="fs-3 fw-bold"></div>
                </div>
                <div class="col-sm-8">
                  <div class="text-muted small mb-1">Solución</div>
                  <div id="solucion"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Procedimiento: una tabla por iteración -->
          <div class="card">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
              <strong id="it-titulo"></strong>
              <div class="d-flex align-items-center gap-2">
                <button id="btn-anterior" class="btn btn-outline-primary btn-sm">&laquo; Anterior</button>
                <span id="it-contador" class="small text-muted"></span>
                <button id="btn-siguiente" class="btn btn-primary btn-sm">Siguiente &raquo;</button>
              </div>
            </div>
            <div class="card-body">
              <p id="it-info" class="mb-3"></p>
              <div class="table-responsive">
                <table id="tabla" class="table table-bordered tabla-simplex mb-0"></table>
              </div>
              <div id="it-operaciones" class="mt-3"></div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- Lógica de la pantalla -->
  <script src="/app/resultados.js"></script>
</body>
</html>
